# Configuration SonarQube — Secure File Vault
# Utilisée par le stage « Sonar » du Jenkinsfile (sonar-scanner)

sonar.projectKey=secure-file-vault
sonar.projectName=Secure File Vault
sonar.projectVersion=1.0

# Sources : backend + frontend
sonar.sources=backend/src,frontend/src

# Exclusions : dépendances, build, couverture, tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.js

sonar.test.inclusions=**/*.test.js
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
